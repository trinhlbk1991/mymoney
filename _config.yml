# ----------------------------------------------------------------- Landing page
# The home page (_layouts/home.html, assets/js/home.js, assets/css/home.css)
# carries its own copy in English and Vietnamese. The keys below feed only the
# link preview and the structured data in _includes/head.html, so keep them in
# step with the page.

capture:
  headline: Pay as usual. It's already written down.
  body: >-
    myMoney reads the payment notifications your bank and e-wallet apps
    already send, and Google's Gemini AI turns each one into a transaction:
    amount, place, category and the right wallet. No typing, no bank login.

# Screenshots listed in the MobileApplication structured data.
features:
  - image: /assets/real/en-light-capture-inbox.webp
  - image: /assets/real/en-light-budget.webp
  - image: /assets/real/en-light-goals.webp
  - image: /assets/real/en-light-report.webp
  - image: /assets/real/en-light-wallets.webp

# Emitted as FAQPage structured data. Same questions as the page's FAQ.
faq:
  - q: Does it work with my bank?
    a: >-
      If your bank or e-wallet app shows a notification when you pay, yes.
      myMoney reads the text, so it doesn't need a list of supported banks,
      and it reads notifications in any language.
  - q: Does auto-capture work on iPhone?
    a: >-
      Yes, on iOS 27 or later. You set up one Shortcuts automation, and the
      app walks you through it with screenshots. On Android, you allow
      notification access and you're done.
  - q: What if it gets a payment wrong?
    a: >-
      Every field stays editable. If you'd rather check first, turn on review
      and each capture waits in To review until you confirm it. You can also
      tie keywords to a category so a merchant always lands in the same place.
  - q: What happens after the 3 free captures?
    a: >-
      Payments still land in To review, marked Premium only, and wait there
      unread. Buy Bánh Xèo and they're all read, so nothing is lost if you
      decide later.
  - q: Which languages and currencies?
    a: >-
      The app is in English and Vietnamese and works with any currency, from
      the đồng to the dollar, euro or yen.

####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

sass:
  style: compressed
  sourcemap: never

exclude:
  - tool
  - _refs
  - habita/node_modules
  - LICENSE
  - README.md
  - CNAME
  - node_modules
  - package.json
  - package-lock.json
  - wrangler.toml
  - Gemfile
  - Gemfile.lock

include:
  - _headers
  - _redirects

keep_files:
  - .well-known

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown
