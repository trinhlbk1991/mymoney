# ----------------------------------------------------------------- Landing page

hero:
  eyebrow: Personal finance · iOS & Android
  # The headline spins its currency word. `headline` is the flat fallback used
  # when `currencies` is empty, and stays the source for <title>/OG copy.
  headline: Every đồng, accounted for.
  headline_prefix: Every
  headline_suffix: ", accounted for."
  currencies:
    - symbol: ₫
      name: đồng
    - symbol: $
      name: dollar
    - symbol: €
      name: euro
    - symbol: ¥
      name: yen
    - symbol: ₩
      name: won
    - symbol: ₹
      name: rupee
    - symbol: ₱
      name: peso
    - symbol: £
      name: pound
  lede: >-
    Log a spend in two taps. See what's left before you spend it. No net-worth
    dashboards, no bank scraping you didn't ask for — just the number you need today.
  trust:
    - On device by default
    - Works offline
    - Paid once, no ads

screens_build_label: Sep 2026 build

screens:
  - title: Home
    body: One total across every wallet, then the day's entries underneath.
    image: /assets/store/shot-home.png
    alt: myMoney home screen with wallet total and today's transactions
  - title: Report
    body: An overspent month gets named in words before you read a chart.
    image: /assets/store/shot-report.png
    alt: myMoney monthly report showing an overspent September
  - title: Transaction
    body: Every field stays editable, receipt photo included.
    image: /assets/store/shot-transaction.png
    alt: myMoney transaction detail with account, category, date and memo

cta:
  headline: Start with today's spending.
  body: >-
    Buy it once on either store. Every update after that is included — no
    subscription, no ads, nothing sold on.

####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

sass:
  style: compressed
  sourcemap: never

exclude:
  - LICENSE
  - README.md
  - CNAME
  - node_modules
  - package.json
  - package-lock.json
  - wrangler.toml
  - Gemfile
  - Gemfile.lock

include:
  - _headers
  - _redirects

keep_files:
  - .well-known

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown
