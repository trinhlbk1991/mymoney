# Production domain — canonical, og:url, og:image and the sitemap resolve
# against it, so it has to be the host people actually reach.
url: "https://mymoney.icedtealabs.com"

# The home page's <title>, description and all its copy, in English and
# Vietnamese, live in _data/home/en.yml and _data/home/vi.yml.

# App Info
app_version: 7.0.0
ios_app_id: 6475389461

# Country-neutral store links: Apple and Google send each visitor to their own
# country's store.
appstore_link: https://apps.apple.com/app/id6475389461
playstore_link: https://play.google.com/store/apps/details?id=com.icedtealabs.mymoney
# App Store Connect → Analytics → Campaigns gives a provider token (pt). Once it
# is set here, every App Store button carries a campaign token (ct) such as
# web-en-hero, so you can see which page and button sent each install. Google
# Play buttons already carry utm_ referrer tags.
appstore_provider_token:
presskit_download_link:

# The app's own launcher icon, from mymoney-mobile's assets/ic_launcher.png,
# resized to 180px — the largest size anything here asks for (iOS home
# screen). Serves as favicon, touch icon and the header brand mark.
app_icon: /assets/app-icon.png
app_name: myMoney
# Default meta description for pages that don't set their own. Kept under 160
# characters: search results cut the rest.
app_description: >-
  Budget & expense tracker for iPhone and Android. AI auto-capture turns your
  bank's payment notifications into transactions — no bank login, no typing.

# The one-sentence positioning. Use these exact words wherever myMoney is
# described (store listings, profiles, press, llms.txt): search engines and AI
# assistants learn what a product is from the same description repeated.
app_long_description: >-
  myMoney is an expense tracker for iPhone and Android that reads your bank's
  payment notifications with AI and records each transaction automatically,
  with no bank login.

# Structured data for the home pages (_includes/head.html).
org_name: Iced Tea Labs
# Every public profile of the app or the studio. Add Product Hunt,
# AlternativeTo, LinkedIn and the Wikidata item here as they're created.
org_same_as:
  - https://apps.apple.com/app/id6475389461
  - https://play.google.com/store/apps/details?id=com.icedtealabs.mymoney
# The founder's own profiles, on the founder in the structured data.
founder_same_as:
  - https://trinhlbk.dev
  - https://x.com/trinhlbk1991
  - https://github.com/trinhlbk1991
screenshots:
  - /assets/real/en-light-capture-inbox.webp
  - /assets/real/en-light-budget.webp
  - /assets/real/en-light-goals.webp
  - /assets/real/en-light-report.webp
  - /assets/real/en-light-wallets.webp
feature_list:
  - AI auto-capture of bank and e-wallet payment notifications
  - Works with any bank or e-wallet that sends payment notifications
  - No bank login or bank connection
  - Expense and income tracking across multiple wallets
  - Monthly budget with a daily safe-to-spend amount
  - Category budgets
  - Savings goals with a monthly amount
  - Monthly reports
  - Recurring transactions
  - Google Drive backup
  - Excel export
  - English and Vietnamese, any currency

# 1200x630 link preview, rendered from tool/social-card.html.
social_image: /assets/social-card.jpg
social_image_alt: >-
  myMoney: a bank payment notification read by AI and saved as a transaction,
  beside the app's home screen.

enable_smart_app_banner: true # Set to true to show a smart app banner at top of page on mobile devices.

# Information About Yourself
your_name: Trinh Le
your_link: https://trinhlbk.dev
your_city: Ho Chi Minh City
email_address: trinhlbk1991@gmail.com
instagram_username: trinhlbk
twitter_username: trinhlbk1991
github_username: trinhlbk1991

# Theme — lime is the app's own accent. The other two ship as alternates in the
# design file: oklch(0.88 0.14 95) amber, oklch(0.86 0.10 200) sky.
accent_color: "oklch(0.90 0.17 128)"

####################################################
### Jekyll Configuration. No need to touch this. ###
####################################################

sass:
  style: compressed
  sourcemap: never

exclude:
  - tool
  - docs
  - _refs
  - bin
  - vendor
  - LICENSE
  - README.md
  - CNAME
  - node_modules
  - package.json
  - package-lock.json
  - wrangler.toml
  - Gemfile
  - Gemfile.lock

include:
  - _headers
  - _redirects

keep_files:
  - .well-known

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown

# Blog posts live in _posts/ with explicit permalinks. Posts dated in the future
# are not built (Jekyll default), so merging a post early does not publish it.
future: false
