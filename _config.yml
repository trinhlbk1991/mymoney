faq:
  - q: How does myMoney record transactions automatically?
    a: >-
      Your bank and e-wallet apps already send a notification for every
      payment. With auto-capture on, myMoney reads those notifications from
      the apps you pick, and Google's Gemini AI turns each one into a
      transaction with the amount, place, category and wallet filled in.
  - q: Do I have to give myMoney my bank login?
    a: >-
      No. myMoney never connects to your bank. It only reads the payment
      notifications that already appear on your phone, from the apps you
      choose.
  - q: Does auto-capture work on iPhone?
    a: >-
      Yes, on iOS 27 or later. You set up one Shortcuts automation, guided
      step by step in the app, and it sends payment notifications to myMoney.
      On Android, myMoney reads notifications directly once you allow
      notification access.
  - q: What is sent to the AI?
    a: >-
      Only the text of a notification from an app you added, that app's name,
      and your category names, so Gemini can work out the amount and
      category. Notifications from every other app are never read, stored or
      sent, and you can turn capture off or remove an app at any time.
  - q: Is myMoney free?
    a: >-
      myMoney is free to download, and your first 3 auto-captured
      transactions are free. Premium is a one-time purchase — no subscription
      — that removes ads and limits and keeps auto-capture reading every
      payment.
  - q: Which languages and currencies does it support?
    a: >-
      The app is in English and Vietnamese, and works with any currency, from
      the Vietnamese đồng to the dollar, euro or yen.

cta:
  headline: Let your next payment log itself.
  body: >-
    Free on both stores. Premium is bought once — every update after that is
    included. No subscription, nothing sold on.

