sass:
  style: compressed
  sourcemap: never

exclude:
  - tool
  - _refs
  - habita/node_modules
  - LICENSE
  - README.md
  - CNAME
  - node_modules
  - package.json
  - package-lock.json
  - wrangler.toml
  - Gemfile
  - Gemfile.lock

include:
  - _headers
  - _redirects

keep_files:
  - .well-known

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown
