---
# Front matter comment to ensure Jekyll properly reads file.
---

<!DOCTYPE html>
<html lang="en-us">

{% include head.html %}

<body>
<div class="pageShell">

	{% include site-header.html %}

	<main>
		<div class="pageHead">
			{% if page.eyebrow %}<div class="eyebrow">{{ page.eyebrow }}</div>{% endif %}
			<h1>{{ page.title }}</h1>
		</div>
		<article class="prose {% if page.prose_variant %}prose--{{ page.prose_variant }}{% endif %}">
			{{ content }}
		</article>
	</main>

	{% include site-footer.html %}

</div>
</body>
</html>
