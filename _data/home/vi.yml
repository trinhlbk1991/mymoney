faq:
  h2: Câu hỏi thường gặp
  items:
    - q: Có dùng được với ngân hàng của tôi không?
      a: >-
        Được, miễn là ứng dụng ngân hàng hoặc ví điện tử của bạn có gửi thông
        báo khi thanh toán. myMoney đọc nội dung thông báo nên không cần danh
        sách ngân hàng hỗ trợ, và đọc được cả thông báo tiếng Việt lẫn tiếng Anh.
    - q: iPhone có dùng được Tự ghi không?
      a: >-
        Được, từ iOS 27 trở lên. Bạn chỉ cần tạo một lệnh tự động trong Phím
        tắt, ứng dụng có hướng dẫn từng bước kèm ảnh. Với Android, chỉ cần cho
        phép myMoney truy cập thông báo là xong.
    - q: myMoney có cần đăng nhập ngân hàng không?
      a: >-
        Không. myMoney không kết nối với ngân hàng và không bao giờ hỏi mật
        khẩu. Ứng dụng chỉ đọc thông báo thanh toán đã có trên điện thoại, và
        chỉ từ những ứng dụng bạn chọn.
    - q: Nếu ứng dụng ghi sai thì sao?
      a: >-
        Bạn sửa được mọi thông tin. Nếu muốn kiểm tra trước, hãy bật chế độ
        duyệt: mỗi giao dịch sẽ nằm trong mục Cần xem lại cho đến khi bạn xác
        nhận. Bạn cũng có thể gắn từ khóa với danh mục để một nơi chi luôn vào
        đúng chỗ.
    - q: Hết 3 giao dịch tự ghi miễn phí thì sao?
      a: >-
        Thông báo thanh toán vẫn được giữ trong mục Cần xem lại, gắn nhãn Chỉ
        dành cho Premium, chỉ là chưa được đọc. Khi bạn mua Bánh Xèo, tất cả sẽ
        được đọc, nên không sót giao dịch nào.
    - q: Hỗ trợ ngôn ngữ và loại tiền nào?
      a: >-
        Ứng dụng có tiếng Việt và tiếng Anh, dùng được với mọi loại tiền, từ
        đồng, đô la đến euro hay yên.

